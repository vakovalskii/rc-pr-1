<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D-карта</title>
<style>
  :root{
    --bg:#0d0f12; --panel:#15181d; --line:#2a2f38;
    --fg:#eceae6; --dim:#9a9890; --faint:#6b6a64;
    --amber:#ffad33; --amber-ink:#1a1206; --ok:#5fd38a; --bad:#ff6257; --warn:#ffd166;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font:15px/1.5 var(--sans);overscroll-behavior:none}
  button{font:inherit;color:inherit}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
  canvas{display:block;touch-action:none}
  #bar{position:fixed;left:0;right:0;top:0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;
    padding:calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 12px) 10px calc(env(safe-area-inset-left) + 12px);
    background:linear-gradient(#0d0f12f0,#0d0f1200)}
  .pill{display:flex;align-items:baseline;gap:6px;background:#15181dd9;border:1px solid var(--line);border-radius:8px;padding:6px 10px}
  .pill .k{color:var(--dim);font-size:12px}
  .pill b{font-weight:600}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--bad);align-self:center}
  .dot.on{background:var(--ok)}
  .sp{flex:1}
  .btn{background:#15181dd9;border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;min-height:36px;touch-action:manipulation}
  .btn.on{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}
  #empty{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;color:var(--dim);text-align:center;padding:24px}
  #empty p{max-width:46ch;margin:0}
  #empty b{color:var(--fg)}
  #help{position:fixed;left:calc(env(safe-area-inset-left) + 12px);bottom:calc(env(safe-area-inset-bottom) + 10px);color:var(--faint);font-size:12px}
  .lag-bad{color:var(--warn)}
</style>
</head>
<body>
<div id="bar">
  <div class="pill"><span class="dot" id="dot"></span><span id="link">нет связи</span></div>
  <div class="pill"><span class="k">точек</span><b class="num" id="pts">0</b></div>
  <div class="pill"><span class="k">кадров</span><b class="num" id="frames">0</b><span class="k">потеряно</span><b class="num" id="lost">0</b></div>
  <div class="pill"><span class="k">путь</span><b class="num" id="path">0.0</b><span class="k">м</span></div>
  <div class="pill"><span class="k">SLAM</span><b class="num" id="fps">—</b><span class="k">к/с ·</span><b class="num" id="lag">—</b><span class="k">мс</span></div>
  <div class="sp"></div>
  <button class="btn on" id="follow" title="камера следует за машинкой (F)">следом</button>
  <button class="btn" id="top" title="вид сверху (T)">сверху</button>
  <a class="btn" href="/" style="text-decoration:none;color:inherit">пульт</a>
</div>
<div id="empty"><p id="emptyTxt">Жду живой SLAM. На маке запусти <b>live_slam.py</b>, тогда облако начнёт расти, пока машинка едет.</p></div>
<div id="help">крутить: левая кнопка или палец · сдвиг: правая или два пальца · масштаб: колесо или щипок</div>

<script src="/web/vendor/three.min.js"></script>
<script src="/web/vendor/OrbitControls.js"></script>
<script>
const $ = s => document.querySelector(s);
// Мир live_slam — система первого кадра камеры: x вправо, y вниз, z вперёд. В three: y вверх, вперёд = -z.
const renderer = new THREE.WebGLRenderer({antialias: true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0d0f12);
const cam = new THREE.PerspectiveCamera(60, 1, 0.02, 100);
cam.position.set(1.5, 1.6, 1.8);
const controls = new THREE.OrbitControls(cam, renderer.domElement);
controls.enableDamping = true; controls.target.set(0, 0, -1);

const world = new THREE.Group(); scene.add(world);               // поворачиваем целиком, когда известно «вверх»
const cloud = new THREE.Group(); world.add(cloud);
const grid = new THREE.GridHelper(10, 20, 0x3a3f47, 0x22262d); grid.position.y = -0.10; world.add(grid);

const car = new THREE.Group();                                     // машинка: стрелка по направлению камеры
const body = new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.18, 16), new THREE.MeshBasicMaterial({color: 0xffad33}));
body.rotation.x = -Math.PI / 2; car.add(body); world.add(car);
const fov = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.ConeGeometry(0.25, 0.4, 4, 1, true)),
                                   new THREE.LineBasicMaterial({color: 0xffad33, transparent: true, opacity: .35}));
fov.rotation.x = -Math.PI / 2; fov.rotation.y = Math.PI / 4; fov.position.z = -0.2; car.add(fov);

const MAXP = 50000, pathBuf = new Float32Array(MAXP * 3);
const pathGeo = new THREE.BufferGeometry(); pathGeo.setAttribute('position', new THREE.BufferAttribute(pathBuf, 3));
pathGeo.setDrawRange(0, 0); world.add(new THREE.Line(pathGeo, new THREE.LineBasicMaterial({color: 0xffd166})));
let pathN = 0, pathLen = 0, last = null;
const ptMat = new THREE.PointsMaterial({size: 0.035, vertexColors: true, sizeAttenuation: true});

function resize(){ renderer.setSize(innerWidth, innerHeight); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

function clear(){
  while (cloud.children.length) { const c = cloud.children.pop(); c.geometry.dispose(); }
  pathN = 0; pathLen = 0; last = null; pathGeo.setDrawRange(0, 0); world.quaternion.identity();
  $('#pts').textContent = 0; $('#path').textContent = '0.0';
}

function addChunk(buf){
  const n = new DataView(buf).getUint32(1, true);
  const mm = new Int16Array(buf.slice(5, 5 + n * 6)), rgb = new Uint8Array(buf, 5 + n * 6, n * 3);
  const pos = new Float32Array(n * 3), col = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    pos[i * 3] = mm[i * 3] / 1000; pos[i * 3 + 1] = -mm[i * 3 + 1] / 1000; pos[i * 3 + 2] = -mm[i * 3 + 2] / 1000;
    col[i * 3] = rgb[i * 3] / 255; col[i * 3 + 1] = rgb[i * 3 + 1] / 255; col[i * 3 + 2] = rgb[i * 3 + 2] / 255;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  cloud.add(new THREE.Points(g, ptMat));
  $('#empty').style.display = 'none';
}

// поза из системы камеры (y вниз, z вперёд) в three (y вверх, вперёд -z): S·T·S, S = diag(1,-1,-1)
const S = new THREE.Matrix4().makeScale(1, -1, -1);
function onPose(m){
  const T = new THREE.Matrix4().fromArray(m.T).transpose();        // приходит построчно
  const M = new THREE.Matrix4().multiplyMatrices(S, T).multiply(S);
  M.decompose(car.position, car.quaternion, new THREE.Vector3());
  if (m.up) {                                                       // выровнять горизонт по плоскости траектории
    const up = new THREE.Vector3(m.up[0], -m.up[1], -m.up[2]).normalize();
    world.quaternion.setFromUnitVectors(up, new THREE.Vector3(0, 1, 0));
  }
  const p = car.position;
  if (pathN < MAXP && (!last || last.distanceTo(p) > 0.01)) {
    if (last) pathLen += last.distanceTo(p);
    pathBuf.set([p.x, p.y, p.z], pathN * 3); pathN++; pathGeo.setDrawRange(0, pathN);
    pathGeo.attributes.position.needsUpdate = true; last = p.clone();
  }
  $('#pts').textContent = m.pts.toLocaleString('ru-RU'); $('#frames').textContent = m.frames;
  $('#lost').textContent = m.lost + (m.jumps ? ` · скачков ${m.jumps}` : '');
  $('#path').textContent = pathLen.toFixed(1); $('#fps').textContent = m.fps;
  $('#lag').textContent = m.lag_ms; $('#lag').classList.toggle('lag-bad', m.lag_ms > 500);
  if (followOn) {
    const wp = car.getWorldPosition(new THREE.Vector3());
    cam.position.add(wp.clone().sub(controls.target)); controls.target.copy(wp);
  }
}

let followOn = true, topOn = false;
function setFollow(v){ followOn = v; $('#follow').classList.toggle('on', v); }
function setTop(v){
  topOn = v; $('#top').classList.toggle('on', v);
  const t = controls.target;
  if (v) cam.position.set(t.x, t.y + 6, t.z + 0.001); else cam.position.set(t.x + 1.5, t.y + 1.6, t.z + 1.8);
}
$('#follow').onclick = () => setFollow(!followOn);
$('#top').onclick = () => setTop(!topOn);
addEventListener('keydown', e => { if (e.code === 'KeyF') setFollow(!followOn); if (e.code === 'KeyT') setTop(!topOn); });

let ws;
function connect(){
  ws = new WebSocket(`ws://${location.host}/ws/map3dview`); ws.binaryType = 'arraybuffer';
  ws.onopen = () => { $('#dot').classList.add('on'); $('#link').textContent = 'на связи'; };
  ws.onclose = () => { $('#dot').classList.remove('on'); $('#link').textContent = 'нет связи'; setTimeout(connect, 1000); };
  ws.onmessage = e => {
    if (typeof e.data !== 'string') { addChunk(e.data); return; }
    const m = JSON.parse(e.data);
    if (m.type === 'reset') { clear(); $('#empty').style.display = ''; $('#emptyTxt').textContent = m.rec ? 'Новая запись. Жду первые точки…' : 'Жду первые точки…'; }
    if (m.type === 'pose') onPose(m);
  };
}
connect();
(function loop(){ controls.update(); renderer.render(scene, cam); requestAnimationFrame(loop); })();
</script>
</body>
</html>
