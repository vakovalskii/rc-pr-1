<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>RC Buggy</title>
<style>
  :root{--bg:#0f1115;--fg:#e8e9ed;--dim:#8b93a1;--ok:#4ade80;--bad:#f87171;--acc:#60a5fa}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
    font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;touch-action:none;overscroll-behavior:none}
  #view{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
  #hud{position:fixed;top:calc(env(safe-area-inset-top) + 8px);left:8px;right:8px;
    display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
  .chip{background:rgba(15,17,21,.82);border:1px solid #2a3040;border-radius:6px;padding:4px 8px;white-space:nowrap}
  .chip b{color:var(--acc);font-weight:600}
  .bad{color:var(--bad)} .ok{color:var(--ok)}
  #pads{position:fixed;inset:0;display:flex}
  .pad{flex:1;position:relative}
  .knob{position:absolute;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;
    border:2px solid var(--acc);background:rgba(96,165,250,.16);opacity:0;transition:opacity .12s}
  .pad.live .knob{opacity:1}
  .lbl{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 10px);width:100%;
    text-align:center;color:var(--dim);pointer-events:none}
  #mini{position:fixed;right:8px;bottom:calc(env(safe-area-inset-bottom) + 8px);width:150px;height:150px;
    border:1px solid #2a3040;border-radius:8px;background:rgba(15,17,21,.85);display:none;pointer-events:none;z-index:2}
  #reset{pointer-events:auto;cursor:pointer;user-select:none}
  #reset:active{background:#2a3040}
  .kb{display:none;color:#5b6472} @media (hover:hover){.kb{display:inline}}
  .hit{animation:hit .4s}
  @keyframes hit{0%{background:#7f1d1d}100%{background:rgba(15,17,21,.82)}}
</style>

<img id="view" alt="">
<div id="hud">
  <div class="chip">link <b id="link">…</b></div>
  <div class="chip">RTT <b id="rtt">—</b> мс</div>
  <div class="chip">fps <b id="fps">—</b></div>
  <div class="chip">кадр <b id="kb">—</b> КБ</div>
  <div class="chip">поток <b id="bw">—</b> кбит/с</div>
  <div class="chip" id="fs"></div>
  <div class="chip" id="pos" style="display:none">x <b id="px">0</b> y <b id="py">0</b> удары <b id="hits">0</b></div>
  <div class="chip" id="ap" style="display:none"><span class="ok">АВТОПИЛОТ</span> — стрелки перехватят</div>
  <div class="chip" id="reset" title="в точку старта">↺ старт</div>
</div>
<canvas id="mini" width="150" height="150"></canvas>
<div id="pads">
  <div class="pad" id="padT"><div class="knob"></div><div class="lbl">ГАЗ — тяни вверх/вниз<br><span class="kb">или ↑ ↓ / W S</span></div></div>
  <div class="pad" id="padS"><div class="knob"></div><div class="lbl">РУЛЬ — тяни влево/вправо<br><span class="kb">или ← → / A D &nbsp; R — старт</span></div></div>
</div>

<script>
const $ = s => document.querySelector(s);
let ws, steer = 0, throttle = 0, cmdId = 0;
const pending = new Map();               // id -> t0, для замера RTT петли
let rttEMA = null, frames = 0, bytes = 0, lastTick = performance.now();

function connect(){
  ws = new WebSocket(`ws://${location.host}/ws/pult`);
  ws.binaryType = 'arraybuffer';
  ws.onopen  = () => { $('#link').textContent = 'ok'; $('#link').className = 'ok'; };
  ws.onclose = () => { $('#link').textContent = 'нет'; $('#link').className = 'bad';
                       setTimeout(connect, 800); };
  ws.onmessage = e => {
    if (typeof e.data === 'string') {
      const m = JSON.parse(e.data);
      if (m.type === 'pilot') { $('#ap').style.display = m.online ? '' : 'none'; return; }
      if (m.type === 'tele') {
        const t0 = pending.get(m.ack);
        if (t0 !== undefined) {                       // команда вернулась — вот петля
          const rtt = performance.now() - t0;
          rttEMA = rttEMA === null ? rtt : rttEMA * 0.8 + rtt * 0.2;
          $('#rtt').textContent = Math.round(rttEMA);
          pending.clear();
        }
        $('#fs').innerHTML = m.failsafe
          ? '<span class="bad">FAILSAFE</span>'
          : `<span class="ok">v ${m.speed}</span>`;
        if (m.x !== undefined) {                       // машинка в полигоне — есть карта
          $('#pos').style.display = '';
          $('#px').textContent = m.x.toFixed(2); $('#py').textContent = m.y.toFixed(2);
          $('#hits').textContent = m.collisions ?? 0;
          if (m.collision && !$('#pos').classList.contains('hit')) {
            $('#pos').classList.add('hit'); setTimeout(() => $('#pos').classList.remove('hit'), 400);
          }
          drawMini(m);
        }
      }
    } else {
      frames++; bytes += e.data.byteLength;
      $('#kb').textContent = (e.data.byteLength / 1024).toFixed(1);
      const url = URL.createObjectURL(new Blob([e.data], {type:'image/jpeg'}));
      const old = $('#view').src;
      $('#view').src = url;
      if (old.startsWith('blob:')) URL.revokeObjectURL(old);
    }
  };
}
connect();

// команды шлём с фиксированным темпом, а не по каждому касанию:
// так поток предсказуем, и failsafe на борту получает ровный пульс
setInterval(() => {
  kbTick();
  if (!ws || ws.readyState !== 1) return;
  const id = ++cmdId;
  pending.set(id, performance.now());
  if (pending.size > 40) pending.clear();
  ws.send(JSON.stringify({type:'cmd', id, steer:+steer.toFixed(3), throttle:+throttle.toFixed(3)}));
}, 50);                                   // 20 Гц

setInterval(() => {
  const dt = (performance.now() - lastTick) / 1000;
  $('#fps').textContent = (frames / dt).toFixed(1);
  $('#bw').textContent  = Math.round(bytes * 8 / dt / 1000);
  frames = 0; bytes = 0; lastTick = performance.now();
}, 1000);

// --- управление пальцем -------------------------------------------------
function bindPad(el, axis, set){
  const knob = el.querySelector('.knob');
  let id = null, ox = 0, oy = 0;
  const R = 90;                                   // ход в пикселях до упора
  el.addEventListener('pointerdown', e => {
    id = e.pointerId; ox = e.clientX; oy = e.clientY;
    el.setPointerCapture(id); el.classList.add('live');
    const r = el.getBoundingClientRect();
    knob.style.left = (ox - r.left) + 'px'; knob.style.top = (oy - r.top) + 'px';
  });
  el.addEventListener('pointermove', e => {
    if (e.pointerId !== id) return;
    const d = axis === 'y' ? -(e.clientY - oy) : (e.clientX - ox);
    set(Math.max(-1, Math.min(1, d / R)));
  });
  const up = e => {
    if (e.pointerId !== id) return;
    id = null; el.classList.remove('live'); set(0);   // отпустил — в ноль
  };
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
}
bindPad($('#padT'), 'y', v => throttle = v);
bindPad($('#padS'), 'x', v => steer = v);

const sendReset = () => { if (ws && ws.readyState === 1) ws.send(JSON.stringify({type:'reset'})); };
$('#reset').addEventListener('click', sendReset);

// --- клавиатура: стрелки / WASD, R — на старт ---------------------------
// Клавиша — это ступенька, а машинке нужен плавный руль: цель из клавиш,
// значения к ней подтягиваются в такте отправки команд
const KEY = {ArrowUp:'up', KeyW:'up', ArrowDown:'down', KeyS:'down',
             ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right'};
const held = new Set(); let kbLive = false;
addEventListener('keydown', e => {
  if (e.code === 'KeyR') { sendReset(); e.preventDefault(); return; }
  if (KEY[e.code]) { held.add(KEY[e.code]); kbLive = true; e.preventDefault(); }
});
addEventListener('keyup', e => { if (KEY[e.code]) held.delete(KEY[e.code]); });
addEventListener('blur', () => held.clear());
function kbTick(){
  if (!kbLive) return;
  const tT = (held.has('up') ? 1 : 0) - (held.has('down') ? 1 : 0);
  const tS = (held.has('right') ? 1 : 0) - (held.has('left') ? 1 : 0);
  throttle += (tT * 0.7 - throttle) * 0.25;        // газ мягко, 70% максимума с клавиши
  steer    += (tS - steer) * 0.35;                  // руль пошустрее
  if (Math.abs(throttle) < 0.02) throttle = 0;
  if (Math.abs(steer) < 0.02) steer = 0;
  if (!held.size && !throttle && !steer) kbLive = false;
}

// --- минимапа: карта из map_build.py, если релей её раздаёт --------------
let mapMeta = null, mapImg = null, trail = [];
fetch('/map/map.json').then(r => r.ok ? r.json() : null).then(m => {
  if (!m) return;
  mapMeta = m; mapImg = new Image(); mapImg.src = '/map/map.png';
  mapImg.onload = () => { $('#mini').style.display = 'block'; };
}).catch(() => {});
function drawMini(t){
  if (!mapMeta || !mapImg || !mapImg.complete) return;
  const c = $('#mini'), g = c.getContext('2d');
  const k = Math.min(c.width / mapMeta.width, c.height / mapMeta.height);
  const ox = (c.width - mapMeta.width * k) / 2, oy = (c.height - mapMeta.height * k) / 2;
  g.clearRect(0, 0, c.width, c.height);
  g.imageSmoothingEnabled = false;
  g.drawImage(mapImg, ox, oy, mapMeta.width * k, mapMeta.height * k);
  const P = (x, y) => [ox + (x - mapMeta.origin[0]) / mapMeta.res * k,
                       oy + (mapMeta.height - (y - mapMeta.origin[1]) / mapMeta.res) * k];
  trail.push([t.x, t.y]); if (trail.length > 400) trail.shift();
  g.strokeStyle = 'rgba(96,165,250,.8)'; g.lineWidth = 1; g.beginPath();
  trail.forEach(([x, y], i) => { const [a, b] = P(x, y); i ? g.lineTo(a, b) : g.moveTo(a, b); });
  g.stroke();
  const [cx, cy] = P(t.x, t.y), r = 5;
  g.fillStyle = t.collision ? '#f87171' : '#4ade80'; g.beginPath();
  g.moveTo(cx + r * Math.cos(-t.yaw), cy + r * Math.sin(-t.yaw));
  g.lineTo(cx + r * Math.cos(-t.yaw + 2.5), cy + r * Math.sin(-t.yaw + 2.5));
  g.lineTo(cx + r * Math.cos(-t.yaw - 2.5), cy + r * Math.sin(-t.yaw - 2.5));
  g.closePath(); g.fill();
}
</script>
