; L2TP-туннель Pi 4 → офисный MikroTik: у 4G серый адрес, поэтому машинка сама звонит в офис,
; а MikroTik пробрасывает 109.230.162.227:12380 → 10.66.6.2:8080 (пульт). Без IPsec — пульт под паролем.
[lac office]
lns = 109.230.162.227
pppoptfile = /etc/ppp/options.l2tpd.office
length bit = yes
autodial = yes
redial = yes
redial timeout = 5
max redials = 1000000
